# Konfiguracja edytora Pages CMS (https://app.pagescms.org)
media:
  input: assets/img/posts
  output: /assets/img/posts

content:
  - name: posts
    label: Wpisy
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Tytuł
        type: string
        required: true
      - name: date
        label: Data publikacji
        type: date
        options:
          time: true
      - name: description
        label: Krótki opis (do wyszukiwarek i podglądu)
        type: text
      - name: categories
        label: Kategorie (np. Podróże)
        type: string
        list: true
      - name: tags
        label: Tagi (małymi literami)
        type: string
        list: true
      - name: image
        label: Obrazek główny
        type: object
        fields:
          - name: path
            label: Plik
            type: image
          - name: alt
            label: Opis obrazka
            type: string
      - name: pin
        label: Przypnij na górze strony głównej
        type: boolean
        default: false
      - name: body
        label: Treść
        type: rich-text
        options:
          format: markdown

  - name: about
    label: Strona „O mnie”
    type: file
    path: _tabs/about.md
    format: yaml-frontmatter
    fields:
      - name: icon
        type: string
        hidden: true
      - name: order
        type: number
        hidden: true
      - name: body
        label: Treść
        type: rich-text
        options:
          format: markdown
